<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Bé Học Tiếng Anh</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <header>
      <button class="round hidden" id="back" aria-label="Quay lại">⬅️</button>
      <div id="title">Bé Học Tiếng Anh</div>
      <div class="stars" id="stars">⭐ <span>0</span></div>
      <button class="round" id="parent" aria-label="Bố mẹ">⚙️</button>
    </header>
    <main id="main">
      <section class="stage">
        <div class="bubble empty" id="bubble"><div class="en"></div><div class="vi"></div></div>
        <div class="charbox" id="charbox"></div>
      </section>
      <section class="panel" id="panel"></section>
    </main>
  </div>
  <script src="js/data.js"></script>
  <script src="js/book.js"></script>
  <script src="js/characters.js"></script>
  <script src="js/speech.js"></script>
  <script src="js/app.js"></script>
  <script src="js/robot.js"></script>
  <script src="js/games.js"></script>
</body>
</html>
