name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Cai thu vien
        run: npm install

      - name: Dong bo web vao Android
        run: npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Doi ten APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk BeHocTiengAnh.apk

      - uses: actions/upload-artifact@v4
        with:
          name: BeHocTiengAnh-APK
          path: BeHocTiengAnh.apk
